# Operational risk knobs — slippage model + non-safety defaults.
#
# Safety governors (kill-switch thresholds, Kelly fraction, BPR caps,
# go-live gate) moved to `config/risk-thresholds.yaml` per the
# Paperclip postmortem rule: no agent / Claude should write to a
# file that governs its own safety limits.
#
# This file is freely editable by both operator and code; the
# thresholds file is operator-only and CI-enforced.

slippage_model:
  base_haircut_tight_index: 0.30             # spread ≤ 0.10 on SPY/QQQ/IWM
  base_haircut_medium: 0.50                  # spread ≤ 0.25
  base_haircut_wide: 0.70                    # spread > 0.25
  extra_short_dte_le1: 0.10                  # 0DTE/1DTE premium
  extra_long_dte_gt60: 0.05                  # 60+ DTE thin-strike premium

logging:
  level: INFO                                 # DEBUG | INFO | WARNING | ERROR
  audit_logger_path: ~/Library/Application Support/VolScope/audit.log
  broker_logger_path: ~/Library/Application Support/VolScope/broker.log
