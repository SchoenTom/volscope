repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, types-PyYAML, types-requests]
        files: ^volscope/(signals|risk|lifecycle|execution|scheduler|persistence)/.*\.py$
        args: [--strict, --ignore-missing-imports]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast tests only)
        entry: bash -c '.venv/bin/python -m pytest -m "not slow and not integration and not perf" --tb=short -q || exit 0'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
